[project]
name = "errand-agent"
version = "0.1.0"
description = "Chat-based home-services errand agent with code-enforced approvals"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sse-starlette>=2.0",
    "pydantic>=2.6",
    "openai>=1.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["errand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
